[package]
name = "nux-term"
version = "0.1.0"
edition = "2021"
description = "A modern, daemon-backed terminal multiplexer"
license = "MIT"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/nux"
homepage = "https://github.com/sammwyy/nux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "tui", "daemon"]
categories = ["command-line-utilities"]

[[bin]]
name = "nux"
path = "src/main.rs"

[lib]
name = "nux"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
portable-pty = "0.8"
vt100 = "0.15"
ratatui = "0.29"
crossterm = "0.28"
interprocess = "2"
dirs = "5"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
