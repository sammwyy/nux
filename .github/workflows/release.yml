name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            asset_os: linux
            asset_arch: armv7
            apt_packages: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.apt_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker
        shell: bash
        run: |
          var="CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$var=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="nux-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          mkdir "$staging"
          cp LICENSE README.md "$staging"/
          if [ "${{ matrix.asset_os }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/nux.exe" "$staging"/
            asset="nux-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"
            7z a "$asset" "$staging" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/nux" "$staging"/
            asset="nux-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
            tar czf "$asset" "$staging"
          fi
          echo "asset=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
